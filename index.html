<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1, h2 {
    color: #fff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
  }

  button {
    font-size: 22px;
    padding: 15px 35px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin: 0 10px;
    transition: transform 0.3s ease;
  }

  #yesBtn {
    background-color: #ff4d6d;
    color: white;
    z-index: 2;
  }

  #noBtn {
    background-color: white;
    color: #ff4d6d;
  }

  /* GIF animation */
  #valentineGIF {
    max-width: 320px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-top: 25px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 1s ease, transform 1s ease;
  }

  /* Floating hearts */
  .heart {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    animation: floatUp 4s linear forwards;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-120vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div id="main">
  <h1>Trishentha 💕<br>Will you be my Valentine?</h1>
  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">NO 🙃</button>
</div>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  let scale = 1;

  // NO button runs away
  noBtn.addEventListener("mouseenter", () => {
    scale += 0.35;
    yesBtn.style.transform = `scale(${scale})`;

    const padding = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    if (scale > 6) {
      yesBtn.style.position = "fixed";
      yesBtn.style.top = "0";
      yesBtn.style.left = "0";
      yesBtn.style.width = "100vw";
      yesBtn.style.height = "100vh";
      yesBtn.style.fontSize = "60px";
      yesBtn.style.borderRadius = "0";
    }
  });

  // Floating hearts
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "-30px";
    heart.style.fontSize = 16 + Math.random() * 30 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }

  // YES button click
  yesBtn.addEventListener("click", () => {
    const main = document.getElementById("main");
    main.innerHTML = `
      <h1 style="font-size:60px;">THANK YOU FOR CHOOSING ME 💕</h1>
      <h2 style="font-size:42px;">Trishibear 🧸💖</h2>
      <img id="valentineGIF"
           src="https://media.tenor.com/hCquf2xno8UAAAAM/kitten-licks-screen-kitten.gif">
    `;

    const gif = document.getElementById("valentineGIF");

    // Fade & scale GIF in
    setTimeout(() => {
      gif.style.opacity = "1";
      gif.style.transform = "scale(1)";
    }, 100);

    // Confetti burst
    confetti({
      particleCount: 250,
      spread: 100,
      origin: { y: 0.6 }
    });

    // Confetti rain
    let end = Date.now() + 2500;
    (function frame() {
      confetti({
        particleCount: 6,
        spread: 80,
        origin: { x: Math.random(), y: Math.random() - 0.2 }
      });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();

    // Hearts
    setInterval(createHeart, 200);
  });
</script>

</body>
</html>
