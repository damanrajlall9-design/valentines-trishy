<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  h1 {
    color: #fff;
    margin-bottom: 30px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
  }

  button {
    font-size: 22px;
    padding: 15px 35px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin: 0 10px;
    transition: transform 0.3s;
  }

  #yesBtn { background-color: #ff4d6d; color: white; }
  #noBtn { background-color: white; color: #ff4d6d; }

  .heart {
    position: fixed;
    pointer-events: none;
    user-select: none;
    z-index: 9999;
  }

  #valentineGIF {
    max-width: 320px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-top: 25px;
    transform: scale(0.5);
    opacity: 0;
    transition: transform 1s ease-out, opacity 1s ease-out;
  }
</style>
</head>
<body>

<div id="main">
  <h1>Trishentha 💕<br>Will you be my Valentine?</h1>
  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">NO 🙃</button>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
let scale = 1;

// NO button runs away
noBtn.addEventListener("mouseenter", () => {
  scale += 0.35;
  yesBtn.style.transform = `scale(${scale})`;

  const padding = 20;
  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  noBtn.style.position = "fixed";
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";

  if (scale > 6) {
    yesBtn.style.position = "fixed";
    yesBtn.style.top = "0";
    yesBtn.style.left = "0";
    yesBtn.style.width = "100vw";
    yesBtn.style.height = "100vh";
    yesBtn.style.fontSize = "60px";
    yesBtn.style.borderRadius = "0";
    yesBtn.style.display = "flex";
    yesBtn.style.alignItems = "center";
    yesBtn.style.justifyContent = "center";
  }
});

noBtn.addEventListener("click", () => {
  scale += 0.35;
  yesBtn.style.transform = `scale(${scale})`;
});

// Floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💖";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = window.innerHeight + "px";
  heart.style.fontSize = `${10 + Math.random() * 30}px`;
  document.body.appendChild(heart);

  const anim = setInterval(() => {
    const currentTop = parseFloat(heart.style.top);
    heart.style.top = currentTop - 3 + "px";
    heart.style.opacity = (currentTop / window.innerHeight).toString();
    if (currentTop < -50) {
      clearInterval(anim);
      heart.remove();
    }
  }, 20);
}

// YES button click
yesBtn.addEventListener("click", () => {
  const main = document.getElementById("main");
  main.innerHTML = `
    <h1 style="font-size:60px;">THANK YOU FOR CHOOSING ME 💕</h1>
    <h2 style="font-size:42px;">Trishibear 🧸💖</h2>
    <img id="valentineGIF" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">
  `;

  // Animate GIF
  const gif = document.getElementById("valentineGIF");
  setTimeout(() => {
    gif.style.transform = "scale(1)";
    gif.style.opacity = "1";
  }, 50);

  // Start confetti
  confetti({ particleCount: 250, spread: 100, origin: { y: 0.6 } });
  let end = Date.now() + 2500;
  (function frame() {
    confetti({ particleCount: 6, spread: 80, origin: { x: Math.random(), y: Math.random() - 0.2 } });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();

  // Start hearts
  setInterval(createHeart, 200);
});
</script>

</body>
</html>
